# Cut a release whenever a new tag is pushed to the repo.
name: Release
on:
  # Can be triggered from the tag.yaml workflow
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # Or, developers can manually push a tag from their clone
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  release:
    # https://github.com/bazel-contrib/.github/blob/master/.github/workflows/release_ruleset.yaml
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      release_files: bazel_toolchains_vivado-*.tar.gz
      prerelease: false
      # Published directly rather than as a draft. The upstream template opens a
      # draft so a Bazel Central Registry publish job can attach attestations
      # before the release goes live; this repository has no such job -- the BCR
      # submission is made by whoever hosts the module, using the templates in
      # //.bcr -- so there is nothing to wait for.
      draft: false
      tag_name: ${{ inputs.tag_name || github.ref_name }}
